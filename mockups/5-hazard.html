<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Onyx Initiative — Mockup 5: Hazard</title>
<link rel="icon" type="image/svg+xml" href="../onxi-logo-bright.svg">
<style>
  :root { --red:#b52424; --red-dk:#7a1515; --fg:#d6d6d4; }
  * { box-sizing:border-box; margin:0; }
  html,body { height:100%; }
  body { background:#000; color:var(--fg); font:16px/1.4 "Helvetica Neue",Arial,sans-serif; overflow:hidden;
    display:grid; place-items:center; }
  .mark { position:fixed; inset:0; margin:auto; width:min(80vmin,800px); height:min(80vmin,800px);
    background:url("../onxi-logo-bright.svg") center/contain no-repeat; opacity:.14; }
  .tape { position:fixed; left:-10vw; right:-10vw; height:3.2rem; display:flex; align-items:center; overflow:hidden;
    background:repeating-linear-gradient(-45deg, var(--red-dk) 0 22px, #0b0b0b 22px 44px);
    box-shadow:0 0 0 1px #000, 0 8px 30px rgba(0,0,0,.8); }
  .tape.a { top:22%; transform:rotate(-6deg); }
  .tape.b { bottom:20%; transform:rotate(4deg); }
  .tape span { white-space:nowrap; font-weight:900; letter-spacing:.4em; font-size:1rem; color:#fff;
    background:#000; padding:.3rem 1rem; margin-right:2.5rem; text-transform:uppercase; }
  .tape .run { display:flex; animation:scroll 30s linear infinite; }
  .tape.b .run { animation-direction:reverse; }
  .box { position:relative; text-align:center; }
  h1 { font-size:clamp(2rem,7vw,4.5rem); font-weight:900; letter-spacing:.08em; line-height:.95; text-transform:uppercase; }
  h1 em { font-style:normal; display:block; color:transparent; -webkit-text-stroke:1px var(--fg); }
  .sub { margin-top:1rem; letter-spacing:.5em; color:var(--red); font-size:.85rem; }
  .box a { display:inline-block; margin-top:1.5rem; padding:.6rem 1.3rem; background:var(--red-dk); color:#fff;
    text-decoration:none; font-weight:700; letter-spacing:.2em; font-size:.8rem; }
  .box a:hover { background:var(--red); }
  @keyframes scroll { to { transform:translateX(-50%); } }
  @media (prefers-reduced-motion:reduce){ .run{animation:none!important;} }
</style>
</head>
<body>
  <div class="mark" aria-hidden="true"></div>
  <div class="tape a" aria-hidden="true"><div class="run" id="ra"></div></div>
  <div class="tape b" aria-hidden="true"><div class="run" id="rb"></div></div>
  <main class="box">
    <h1>Onyx<em>Initiative</em></h1>
    <div class="sub">[ONXI] · UNDER CONSTRUCTION</div>
    <a href="https://discord.gg/onyxi">JOIN THE DISCORD</a>
  </main>
<script>
for (const [id, txt] of [['ra','Under construction'],['rb','Restricted area · ONXI personnel only']]) {
  const el = document.getElementById(id);
  el.innerHTML = Array(24).fill(`<span>${txt}</span>`).join('');
}
</script>
</body>
</html>
